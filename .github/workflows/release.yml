name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: "29.0.1"
          elixir-version: "1.20.0"
      # Burrito's Zig check is exact equality — this pin must move together
      # with the {:burrito, ...} version in mix.exs.
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.15.2"
      - run: sudo apt-get install -y xz-utils
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix test
      - run: MIX_ENV=prod mix release sev
      # Dispatch runs (the mix tag pre-flight) upload a workflow artifact for
      # the local smoke check; only real tag pushes publish a release.
      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: burrito_out
          path: burrito_out/*
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: burrito_out/*
          generate_release_notes: true
